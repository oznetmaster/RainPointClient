name: Unit tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: library
            project: tests/RainPointClient.Tests/RainPointClient.Tests.csproj
            framework: net472
          - suite: library
            project: tests/RainPointClient.Tests/RainPointClient.Tests.csproj
            framework: net10.0
          - suite: windows
            project: tests/RainPointClient.Desktop.Tests/RainPointClient.Desktop.Tests.csproj
            framework: net472
          - suite: windows
            project: tests/RainPointClient.Desktop.Tests/RainPointClient.Desktop.Tests.csproj
            framework: net10.0-windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run offline NUnit tests
        shell: pwsh
        env:
          TEST_PROJECT: ${{ matrix.project }}
          TEST_FRAMEWORK: ${{ matrix.framework }}
        run: dotnet test $env:TEST_PROJECT -c Release -f $env:TEST_FRAMEWORK --filter "TestCategory!=Live" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}-${{ matrix.framework }}
          path: artifacts/test-results/*.trx
          if-no-files-found: error
  release-policy:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release metadata and check policy
        shell: pwsh
        run: ./tools/Test-ReleasePreparation.ps1
